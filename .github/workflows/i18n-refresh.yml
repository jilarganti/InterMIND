name: i18n refresh (mind-com)

# Refreshes localized content/UI strings whenever English sources change on main.
# - content (blog + legal): mirrors content/{blog,legal}/<f>.md → content/<locale>/{blog,legal}/<f>.md
# - UI strings: translates app/locales/{es,pt,fr,de,ru,zh}.json entries marked [NEEDS_TRANSLATION]
# If diffs are produced, commits them straight back to main (no PR — translations are not
# hand-reviewed). The push to main is what Vercel deploys, so prod picks them up automatically.
# Manual run via workflow_dispatch is also supported.

on:
  push:
    branches: [main]
    paths:
      - "packages/mind-com/content/blog/**"
      - "packages/mind-com/content/legal/**"
      - "packages/mind-com/app/locales/en.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Translation mode"
        required: true
        default: "from-en"
        type: choice
        options: [from-en, all]

permissions:
  contents: write

# Serialize runs so two back-to-back pushes don't both rebase+push to main and race.
# Don't cancel in-progress: a half-finished translation push would leave main inconsistent.
concurrency:
  group: i18n-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mind-com

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the push-range diff (I18N_DIFF_BASE..HEAD) and `git show` resolve.
          fetch-depth: 0

      # Resolve the diff base to the push range (github.event.before..HEAD) so a newly
      # pushed post is detected. After a clean checkout `git diff HEAD` is empty, so the
      # content script reads I18N_DIFF_BASE instead. Fall back to HEAD~1 when no usable
      # "before" exists: workflow_dispatch (empty), branch creation (all-zeros), or a
      # rewritten/absent commit.
      - name: Resolve diff base
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE"
          fi
          echo "I18N_DIFF_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Resolved i18n diff base: $BASE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Refresh content translations
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TRANSLATION_EVAL_MODEL: ${{ vars.TRANSLATION_EVAL_MODEL }}
          TRANSLATION_EVAL_FALLBACK_MODEL: ${{ vars.TRANSLATION_EVAL_FALLBACK_MODEL }}
        run: |
          MODE="${{ inputs.mode || 'from-en' }}"
          pnpm exec tsx scripts/i18n-translate-content.ts --"$MODE"

      - name: Refresh UI string translations
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TRANSLATION_EVAL_MODEL: ${{ vars.TRANSLATION_EVAL_MODEL }}
          TRANSLATION_EVAL_FALLBACK_MODEL: ${{ vars.TRANSLATION_EVAL_FALLBACK_MODEL }}
        run: pnpm exec tsx scripts/i18n-translate-ui.ts --from-en

      - name: Detect changes
        id: diff
        working-directory: .
        run: |
          # --porcelain (not `git diff`) so newly-added locale files for a brand-new post —
          # which are untracked, not modifications — also count. `git diff` sees only tracked
          # changes, so every new digest produced translations but committed nothing.
          if [ -n "$(git status --porcelain -- packages/mind-com/content packages/mind-com/app/locales)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Commit translations straight to main — they aren't hand-reviewed, so a PR is just
      # manual-merge friction. The push to main is what Vercel deploys, so prod auto-updates.
      #
      # The commit is made with the built-in GITHUB_TOKEN, whose pushes do NOT trigger other
      # workflows (GitHub's recursion guard). That's intentional here: it stops this job from
      # re-triggering itself in a loop, and Vercel's GitHub integration deploys off the push
      # event itself (not Actions), so prod still picks the commit up.
      - name: Commit translations to main
        if: steps.diff.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/mind-com/content packages/mind-com/app/locales
          git commit -m "chore(i18n): refresh translations [skip ci]"
          # Rebase onto the latest main in case another commit landed during translation,
          # then push. Translations only touch content/<locale>/** and locales/*.json, so a
          # concurrent source change won't conflict; --rebase keeps history linear.
          git pull --rebase origin main
          git push origin HEAD:main
